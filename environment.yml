name: DeepMASC
channels:
  - nvidia
  - pytorch
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pytorch
  - pytorch-cuda=11.8
  - scikit-learn
  - scikit-image
  - matplotlib
  - seaborn
  - biopython
  - numba
  - numpy<2
  - scipy
  - tqdm
  - mrcfile
  - loguru
  - mkl=2024.0
  - pytz
  - pandas
  - pip
  - pip:
      - ortools
      - progress
      - numba-progress
      - starfile
