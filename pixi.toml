[project]
name = "AutoClass3D"
channels = ["conda-forge", "bioconda", "nvidia", "pytorch"]
platforms = ["linux-64"]
authors = ["Han Zhu <zhu773@purdue.edu>"]
readme = "README.md"
repository = "https://github.itap.purdue.edu/kiharalab/AutoClass3D/"

[system-requirements]
cuda = "12"

[tasks]
cryoread = "PYTHONNOUSERSITE=1 python CryoREAD/main.py"
test_cuda = "PYTHONNOUSERSITE=1 python -c \"import torch; print(torch.cuda.is_available())\""
autocontour = "PYTHONNOUSERSITE=1 python contour.py"

[dependencies]
python = "3.11.*"
pytorch-cuda = "*"
scikit-learn = "*"
scikit-image = "*"
matplotlib = "*"
biopython = "*"
numba = "*"
numpy = "<2"
scipy = "*"
tqdm = "*"
mrcfile = "*"
loguru = "*"
mkl = "2024.0.*"

[pypi-dependencies]
ortools = ">=9.11.4210, <10"
progress = ">=1.6, <2"
numba-progress = ">=1.1.0, <2"
