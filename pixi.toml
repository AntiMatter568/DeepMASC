[project]
name = "AutoClass3D"
channels = [
    "nvidia/label/cuda-11.8.0",
    "conda-forge",
    "bioconda",
    "nvidia",
    "pytorch",
]
platforms = ["linux-64"]
authors = ["Han Zhu <zhu773@purdue.edu>"]
readme = "README.md"
repository = "https://github.itap.purdue.edu/kiharalab/AutoClass3D/"

[tasks]
cryoread = "PYTHONNOUSERSITE=1 python CryoREAD/main.py"
test_cuda = "PYTHONNOUSERSITE=1 python -c \"import torch; print(torch.cuda.is_available())\""
autocontour = "PYTHONNOUSERSITE=1 python contour.py"
autoselectclass = "PYTHONNOUSERSITE=1 python main.py"

[dependencies]
python = "3.11.*"
cuda = { version = "*", channel = "nvidia/label/cuda-11.8.0" }
pytorch = { version = "2.0.*", channel = "pytorch" }
pytorch-cuda = { version = "11.8.*", channel = "pytorch" }
scikit-learn = "*"
scikit-image = "*"
matplotlib = "*"
seaborn = "*"
biopython = "*"
numba = "*"
numpy = "<2"
scipy = "*"
tqdm = "*"
mrcfile = "*"
loguru = "*"
mkl = "2024.0.*"
pytz = ">=2025.2,<2026"
pandas = ">=2.3.2,<3"

[pypi-dependencies]
ortools = ">=9.11.4210, <10"
progress = ">=1.6, <2"
numba-progress = ">=1.1.0, <2"
starfile = ">=0.5.13, <0.6"
